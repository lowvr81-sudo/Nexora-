
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexora</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0814;color:#fff;font-family:Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
:root{--purple:#9665ff;--cyan:#53e6ff;--panel:#191328;--border:#352849}
.logo{display:flex;align-items:center;justify-content:center;gap:12px;font-size:27px;font-weight:900;letter-spacing:3px}
.logo svg{width:48px;height:48px}
.logo b{color:var(--cyan)}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at top,#38205b66,transparent 55%)}
.auth-card{width:100%;max-width:430px;padding:36px;background:var(--panel);border:1px solid var(--border);border-radius:22px;box-shadow:0 20px 80px #0008}
.tagline{text-align:center;color:#aaa;margin:15px 0 30px}
h1{text-align:center;font-size:25px}
.desc{text-align:center;color:#aaa;font-size:14px;margin-bottom:25px}
label{display:block;font-size:12px;color:#c8bddb;margin:15px 0 7px}
input{width:100%;padding:14px;background:#0e0b17;color:white;border:1px solid var(--border);border-radius:10px;outline:none}
input:focus{border-color:var(--purple)}
.btn{width:100%;padding:14px;margin-top:12px;border:0;border-radius:10px;background:linear-gradient(110deg,#8050e8,#a16bff);color:white;font-weight:bold}
.btn:hover{filter:brightness(1.12)}
.google{background:white;color:#222}
.or{text-align:center;color:#888;margin:22px}
#status{text-align:center;color:#ffaaa8;font-size:13px;margin-top:15px;overflow-wrap:anywhere}
#app{display:none;height:100vh}
.sidebar{width:240px;background:#151020;border-right:1px solid var(--border);padding:20px;display:flex;flex-direction:column;flex-shrink:0}
.sidebar .logo{font-size:20px;margin-bottom:35px}
.sidebar .logo svg{width:38px;height:38px}
.section{font-size:11px;letter-spacing:2px;color:#887d9e;margin:10px}
.channel{display:block;width:100%;padding:13px;text-align:left;border:0;border-radius:9px;background:transparent;color:#bbb;margin:3px 0}
.channel:hover,.channel.active{background:#352449;color:white}
.bottom{margin-top:auto}
.profile{padding:15px 0;border-top:1px solid var(--border);color:#ddd}
.logout{background:#38243c;color:#ffb9d1}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{padding:20px 25px;background:#151020;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
.messages{flex:1;overflow:auto;padding:25px}
.welcome{text-align:center;color:#aaa;margin:60px 0}
.welcome strong{display:block;color:white;font-size:21px;margin-bottom:10px}
.message{display:flex;gap:12px;margin:18px 0}
.avatar{width:38px;height:38px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--purple),var(--cyan));color:#111;font-weight:bold}
.message-name{color:#bd9aff;font-weight:bold;font-size:13px;margin-bottom:5px}
.message-content{white-space:pre-wrap;overflow-wrap:anywhere}
.composer{padding:16px 22px;background:#151020;border-top:1px solid var(--border)}
.composer form{display:flex;gap:10px}
.composer input{flex:1}
.composer button{width:100px;margin:0}
@media(max-width:650px){.sidebar{width:76px;padding:10px}.sidebar .logo{font-size:0}.sidebar .logo svg{width:42px}.section,.channel span,.profile-name{display:none}.channel{text-align:center;font-size:20px}.profile{text-align:center}.messages{padding:12px}}
</style>
</head>
<body>

<div class="auth-wrap" id="auth">
 <div class="auth-card">
  <div class="logo">
   <svg viewBox="0 0 100 100" fill="none">
    <path d="M18 78V22L82 78V22" stroke="#9665ff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 22L82 78" stroke="#53e6ff" stroke-width="5" stroke-linecap="round"/>
   </svg>
   <span>NEXORA<b>.</b></span>
  </div>
  <div class="tagline">Your community. Your space.</div>
  <h1>Welcome back</h1>
  <div class="desc">Sign in or create your Nexora account.</div>

  <label>DISPLAY NAME (NEW ACCOUNTS)</label>
  <input id="name" placeholder="Your username">
  <label>EMAIL</label>
  <input id="email" type="email" placeholder="you@example.com">
  <label>PASSWORD</label>
  <input id="password" type="password" placeholder="Your password">

  <button class="btn" id="signup">Create account</button>
  <button class="btn" id="login">Log in</button>
  <div class="or">OR</div>
  <button class="btn google" id="google">🌐 Continue with Google</button>
  <div id="status"></div>
 </div>
</div>

<div id="app">
 <aside class="sidebar">
  <div class="logo">
   <svg viewBox="0 0 100 100" fill="none">
    <path d="M18 78V22L82 78V22" stroke="#9665ff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 22L82 78" stroke="#53e6ff" stroke-width="5" stroke-linecap="round"/>
   </svg>
   <span>NEXORA<b>.</b></span>
  </div>
  <div class="section">CHANNELS</div>
  <button class="channel active" data-channel="general"># <span>general</span></button>
  <button class="channel" data-channel="gaming">🎮 <span>gaming</span></button>
  <button class="channel" data-channel="memes">😂 <span>memes</span></button>
  <button class="channel" data-channel="music">♫ <span>music</span></button>
  <button class="channel" data-channel="hangout">☕ <span>hangout</span></button>
  <div class="bottom">
   <div class="profile">● <span class="profile-name" id="profileName">User</span></div>
   <button class="channel logout" id="logout">↪ <span>Log out</span></button>
  </div>
 </aside>
 <main class="main">
  <header class="topbar">
   <strong id="channelTitle"># general</strong>
   <span style="color:#80e9b2;font-size:12px">● Nexora</span>
  </header>
  <section class="messages" id="messages">
   <div class="welcome"><strong>Welcome to Nexora</strong>Choose a channel to start chatting.</div>
  </section>
  <div class="composer">
   <form id="sendForm">
    <input id="messageInput" maxlength="1000" placeholder="Message #general..." autocomplete="off">
    <button class="btn" type="submit">Send</button>
   </form>
  </div>
 </main>
</div>

<script>
const SUPABASE_URL = "https://qinygfihuqktnokzxmrt.supabase.co";
const SUPABASE_KEY = "sb_publishable_anLj1LjbDtSSeCGRJPc-zw_u2ghYdkC";
const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let user = null;
let channel = "general";
let subscription = null;
let changingChannel = false;

const el = id => document.getElementById(id);

function status(message,success=false){
 el("status").textContent=message;
 el("status").style.color=success?"#80e9b2":"#ffaaa8";
}

async function signUp(){
 const name=el("name").value.trim();
 const email=el("email").value.trim();
 const password=el("password").value;
 if(!name||!email||!password)return status("Enter your name, email and password.");
 const {error}=await db.auth.signUp({
  email,password,
  options:{data:{display_name:name}}
 });
 status(error?error.message:"Account created. Check your email if confirmation is required.",!error);
}

async function signIn(){
 const email=el("email").value.trim();
 const password=el("password").value;
 if(!email||!password)return status("Enter your email and password.");
 const {error}=await db.auth.signInWithPassword({email,password});
 if(error)status(error.message);
}

async function googleLogin(){
 const button=el("google");
 if(!["http:","https:"].includes(location.protocol)){
  return status("Open this page using a web server, not by double-clicking the file.");
 }
 button.disabled=true;
 button.textContent="Connecting to Google...";
 status("Opening Google sign-in...",true);
 try{
  const {data,error}=await db.auth.signInWithOAuth({
   provider:"google",
   options:{
    redirectTo:location.origin+location.pathname,
    skipBrowserRedirect:true
   }
  });
  if(error)throw error;
  if(!data.url)throw new Error("No Google login URL returned by Supabase.");
  location.assign(data.url);
 }catch(error){
  status("Google login error: "+error.message);
  button.disabled=false;
  button.textContent="🌐 Continue with Google";
 }
}

function showApp(sessionUser){
 user=sessionUser;
 el("auth").style.display="none";
 el("app").style.display="flex";
 const name=user.user_metadata?.display_name||user.email?.split("@")[0]||"User";
 el("profileName").textContent=name;
 selectChannel("general");
}

async function logout(){
 const {error}=await db.auth.signOut();
 if(error)status(error.message);
}

async function selectChannel(next){
 if(changingChannel)return;
 changingChannel=true;
 channel=next;
 el("channelTitle").textContent="# "+channel;
 el("messageInput").placeholder="Message #"+channel+"...";
 document.querySelectorAll("[data-channel]").forEach(b=>{
  b.classList.toggle("active",b.dataset.channel===channel);
 });
 if(subscription){
  await db.removeChannel(subscription);
  subscription=null;
 }
 await loadMessages();
 subscription=db.channel("messages-"+channel)
  .on("postgres_changes",{
   event:"INSERT",schema:"public",table:"messages",
   filter:"channel=eq."+channel
  },payload=>{
   if(payload.new.user_id!==user?.id)addMessage(payload.new);
  }).subscribe();
 changingChannel=false;
}

async function loadMessages(){
 const box=el("messages");
 box.innerHTML="";
 const {data,error}=await db.from("messages").select("*")
  .eq("channel",channel).order("created_at",{ascending:true}).limit(100);
 if(error){box.textContent="Message error: "+error.message;return;}
 if(!data.length){
  box.innerHTML='<div class="welcome"><strong>Welcome to #'+channel+'</strong>Start the conversation.</div>';
 }else data.forEach(addMessage);
}

function addMessage(message){
 const box=el("messages");
 const welcome=box.querySelector(".welcome");
 if(welcome)welcome.remove();
 const item=document.createElement("div");
 item.className="message";
 const avatar=document.createElement("div");
 avatar.className="avatar";
 avatar.textContent=(message.username||"U")[0].toUpperCase();
 const body=document.createElement("div");
 const name=document.createElement("div");
 name.className="message-name";
 name.textContent=message.username||"User";
 const content=document.createElement("div");
 content.className="message-content";
 content.textContent=message.content;
 body.append(name,content);
 item.append(avatar,body);
 box.append(item);
 box.scrollTop=box.scrollHeight;
}

async function sendMessage(event){
 event.preventDefault();
 const input=el("messageInput");
 const content=input.value.trim();
 if(!content||!user)return;
 const {data,error}=await db.from("messages").insert({
  user_id:user.id,
  username:user.user_metadata?.display_name||user.email?.split("@")[0]||"User",
  channel,content
 }).select().single();
 if(error)return alert("Message error: "+error.message);
 if(data)addMessage(data);
 input.value="";
}

el("signup").onclick=signUp;
el("login").onclick=signIn;
el("google").onclick=googleLogin;
el("logout").onclick=logout;
el("sendForm").onsubmit=sendMessage;
document.querySelectorAll("[data-channel]").forEach(b=>{
 b.onclick=()=>selectChannel(b.dataset.channel);
});

db.auth.onAuthStateChange((event,session)=>{
 if(session?.user){
  if(user?.id!==session.user.id)showApp(session.user);
 }else if(event==="SIGNED_OUT"){
  user=null;
  el("app").style.display="none";
  el("auth").style.display="flex";
 }
});

db.auth.getSession().then(({data,error})=>{
 if(error)status(error.message);
 if(data.session?.user)showApp(data.session.user);
});
</script>
</body>
</html>
