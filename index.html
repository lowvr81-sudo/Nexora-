
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexora</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090817;color:white;font-family:Arial,sans-serif}
.app{display:flex;height:100vh}
.servers{width:65px;background:#070612;padding:12px;display:flex;flex-direction:column;gap:12px;align-items:center}
.logo{width:43px;height:43px;border-radius:15px;background:linear-gradient(135deg,#a855f7,#2563eb);display:grid;place-items:center;font-size:24px;font-weight:bold}
.server{width:42px;height:42px;border:0;border-radius:14px;background:#201b38;color:white;font-size:20px;cursor:pointer}
.sidebar{width:230px;background:#100e20;padding:20px 14px;border-right:1px solid #30264c}
.brand{font-size:25px;font-weight:900;letter-spacing:3px;background:linear-gradient(90deg,#d946ef,#38bdf8);color:transparent;background-clip:text}
.cover{width:100%;height:115px;object-fit:cover;border-radius:12px;margin:20px 0}
.heading{font-size:11px;color:#9188ad;margin:18px 8px 8px;letter-spacing:2px}
.channel{width:100%;padding:11px;border:0;border-radius:8px;background:none;color:#aaa2c4;text-align:left;cursor:pointer;font-size:14px}
.channel:hover,.channel.active{background:#292044;color:white}
.profile{position:absolute;bottom:15px;color:#b9b1d0;font-size:13px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:60px;border-bottom:1px solid #29213e;padding:20px;font-weight:bold}
.banner{margin:20px;height:175px;border-radius:16px;background:linear-gradient(90deg,#090817dd,#09081733),url('nexora-cover.png') center/cover;display:flex;align-items:center;padding:25px;border:1px solid #6341a0}
.banner h1{font-size:38px;margin:0}
.banner p{color:#d5c8ff}
.chat{flex:1;padding:22px;overflow-y:auto}
.message{margin-bottom:20px;display:flex;gap:12px}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#a855f7,#2563eb);display:grid;place-items:center;font-weight:bold;flex-shrink:0}
.message p{margin:5px 0;color:#d0c9e3}
.composer{display:flex;gap:10px;padding:15px 22px}
input{flex:1;min-width:0;padding:15px;border-radius:10px;background:#201b35;border:1px solid #393052;color:white;outline:none}
button.send{border:0;border-radius:10px;padding:0 22px;background:linear-gradient(90deg,#9333ea,#2563eb);color:white;font-weight:bold;cursor:pointer}
@media(max-width:600px){.sidebar{width:165px}.servers{width:50px;padding:7px}.banner{height:130px;margin:12px}.banner h1{font-size:25px}}
</style>
</head>
<body>
<div class="app">
 <aside class="servers">
  <div class="logo">N</div>
  <button class="server">🎮</button>
  <button class="server">✦</button>
  <button class="server">＋</button>
 </aside>

 <aside class="sidebar">
  <div class="brand">NEXORA</div>
  <img class="cover" src="nexora-cover.png" alt="Nexora logo">
  <div class="heading">COMMUNITY</div>
  <button class="channel active" data-name="general"># general</button>
  <button class="channel" data-name="gaming">🎮 gaming</button>
  <button class="channel" data-name="memes">😂 memes</button>
  <button class="channel" data-name="music">♫ music</button>
  <div class="heading">VOICE CHANNELS</div>
  <button class="channel" data-name="hangout">🔊 Hangout</button>
  <div class="profile">🟢 Low · Online</div>
 </aside>

 <main class="main">
  <div class="top"># <span id="channelName">general</span></div>
  <section class="banner">
   <div>
    <h1>Welcome to Nexora</h1>
    <p>Your people. Your games. Your community.</p>
   </div>
  </section>
  <section class="chat" id="chat">
   <div class="message">
    <div class="avatar">N</div>
    <div><b>Nexora Bot</b><p>Welcome to Nexora! Have fun ✨</p></div>
   </div>
  </section>
  <form class="composer" id="form">
   <input id="message" maxlength="500" placeholder="Message #general..." autocomplete="off">
   <button class="send">Send ➤</button>
  </form>
 </main>
</div>

<script>
const chat=document.getElementById('chat');
const input=document.getElementById('message');

document.querySelectorAll('.channel').forEach(button=>{
 button.onclick=()=>{
  document.querySelectorAll('.channel').forEach(b=>b.classList.remove('active'));
  button.classList.add('active');
  const name=button.dataset.name;
  document.getElementById('channelName').textContent=name;
  input.placeholder='Message #'+name+'...';
  chat.innerHTML='';
 };
});

document.getElementById('form').onsubmit=e=>{
 e.preventDefault();
 const value=input.value.trim();
 if(!value)return;
 const row=document.createElement('div');
 row.className='message';
 const avatar=document.createElement('div');
 avatar.className='avatar';
 avatar.textContent='L';
 const content=document.createElement('div');
 const username=document.createElement('b');
 username.textContent='Low';
 const message=document.createElement('p');
 message.textContent=value;
 content.append(username,message);
 row.append(avatar,content);
 chat.append(row);
 input.value='';
 chat.scrollTop=chat.scrollHeight;
};
</script>
</body>
</html>
