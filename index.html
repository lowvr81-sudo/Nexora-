
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexora — Your Community</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg:#090711;
  --panel:#151123;
  --panel2:#1e1830;
  --purple:#9665ff;
  --cyan:#53e6ff;
  --text:#f7f4ff;
  --muted:#a49bb8;
  --border:#302642;
}
*{box-sizing:border-box}
body{
  margin:0;background:
  radial-gradient(ellipse at 15% 10%,#34205c55,transparent 45%),
  radial-gradient(ellipse at 90% 90%,#123b5050,transparent 45%),
  var(--bg);
  color:var(--text);font-family:Inter,Arial,sans-serif;
  min-height:100vh;
}
button,input{font:inherit}
button{cursor:pointer}
.logo{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:2px}
.logo svg{width:45px;height:45px;filter:drop-shadow(0 0 12px #9665ff77)}
.logo span{font-size:25px}
.logo b{color:var(--cyan)}
.auth-wrap{
  min-height:100vh;display:flex;align-items:center;
  justify-content:center;padding:25px;
}
.auth-card{
  width:100%;max-width:440px;padding:38px;
  background:#151123ed;border:1px solid var(--border);
  border-radius:24px;box-shadow:0 25px 100px #0009;
}
.brand{justify-content:center;margin-bottom:28px}
.tagline{text-align:center;color:var(--muted);margin:-15px 0 28px}
h1{text-align:center;font-size:25px;margin:0 0 8px}
.description{text-align:center;color:var(--muted);font-size:14px;margin-bottom:25px}
.field-label{font-size:12px;color:#c7bdd8;margin:14px 0 7px;display:block}
input{
  width:100%;padding:14px 15px;background:#0d0a17;
  color:white;border:1px solid var(--border);border-radius:11px;
  outline:none;transition:.2s;
}
input:focus{border-color:var(--purple);box-shadow:0 0 0 3px #9665ff22}
.btn{
  width:100%;padding:14px;border:0;border-radius:11px;
  color:white;font-weight:700;background:linear-gradient(110deg,#8050e8,#a16bff);
  margin-top:13px;transition:.2s;
}
.btn:hover{filter:brightness(1.13);transform:translateY(-1px)}
.google{
  background:#fff;color:#171321;display:flex;
  justify-content:center;align-items:center;gap:12px;
}
.google svg{width:20px;height:20px}
.google:disabled{opacity:.6;cursor:wait}
.or{display:flex;align-items:center;gap:12px;color:#837b93;margin:22px 0;font-size:12px}
.or:before,.or:after{content:"";height:1px;background:var(--border);flex:1}
#status{font-size:13px;text-align:center;line-height:1.5;margin-top:16px;color:#ffaaa8}
.hint{color:var(--muted);font-size:11px;text-align:center;margin-top:18px;line-height:1.5}
#app{display:none;min-height:100vh}
.sidebar{
  width:255px;flex-shrink:0;background:#110d1eee;
  border-right:1px solid var(--border);padding:24px 16px;
  display:flex;flex-direction:column;
}
.sidebar .logo{padding:0 8px 28px}
.section-label{font-size:10px;color:#837a99;letter-spacing:2px;padding:10px}
.channel{
  display:flex;gap:10px;align-items:center;width:100%;
  padding:12px;background:transparent;border:0;
  color:var(--muted);text-align:left;border-radius:10px;margin:3px 0;
}
.channel:hover,.channel.active{background:#302044;color:white}
.channel.active{box-shadow:inset 3px 0 var(--purple)}
.sidebar-bottom{margin-top:auto}
.profile{
  display:flex;align-items:center;gap:10px;padding:13px;
  border-top:1px solid var(--border);margin-top:15px;
}
.avatar{
  width:37px;height:37px;border-radius:50%;
  background:linear-gradient(135deg,var(--purple),var(--cyan));
  display:grid;place-items:center;font-weight:bold;color:#100b1b;
}
.profile small{display:block;color:var(--muted);margin-top:3px}
.logout{background:#342039;color:#ffb9d1}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh}
.topbar{
  padding:20px 28px;border-bottom:1px solid var(--border);
  background:#110d1ecc;display:flex;align-items:center;
  justify-content:space-between;
}
.topbar h2{margin:0;font-size:18px}
.online{font-size:12px;color:#80e9b2}
.messages{flex:1;overflow-y:auto;padding:25px 30px}
.welcome{text-align:center;color:var(--muted);margin:50px auto}
.welcome strong{color:white;font-size:20px;display:block;margin-bottom:8px}
.message{display:flex;gap:12px;margin:18px 0}
.message .avatar{flex-shrink:0}
.message-body{min-width:0}
.message-name{font-weight:bold;color:#c7aaff;font-size:13px;margin-bottom:5px}
.message-content{color:#e6e0ef;white-space:pre-wrap;overflow-wrap:anywhere}
.composer{padding:18px 25px;border-top:1px solid var(--border);background:#110d1e}
.composer form{display:flex;gap:12px;max-width:1100px;margin:auto}
.composer input{flex:1}
.composer button{width:100px;margin:0}
@media(max-width:650px){
  .auth-card{padding:25px}
  .sidebar{width:75px;padding:12px 7px}
  .sidebar .logo{padding:0 5px 20px}
  .sidebar .logo span,.section-label,.channel span,.profile .profile-info,.logout-text{display:none}
  .channel{justify-content:center;font-size:20px}
  .profile{justify-content:center;padding:10px 0}
  .topbar{padding:16px}
  .messages{padding:15px}
}
</style>
</head>
<body>

<div class="auth-wrap" id="auth">
  <div class="auth-card">
    <div class="logo brand">
      <svg viewBox="0 0 100 100" fill="none">
        <path d="M18 78V22L82 78V22" stroke="#9665ff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M18 22L82 78" stroke="#53e6ff" stroke-width="5" stroke-linecap="round"/>
      </svg>
      <span>NEXORA<b>.</b></span>
    </div>
    <div class="tagline">Your community. Your space.</div>
    <h1>Welcome to Nexora</h1>
    <div class="description">Sign in to join your communities.</div>

    <label class="field-label" for="name">DISPLAY NAME (NEW ACCOUNTS)</label>
    <input id="name" placeholder="Your username">

    <label class="field-label" for="email">EMAIL</label>
    <input id="email" type="email" placeholder="you@example.com">

    <label class="field-label" for="password">PASSWORD</label>
    <input id="password" type="password" placeholder="Your password">

    <button class="btn" id="signup">Create account</button>
    <button class="btn" id="login">Log in</button>

    <div class="or">OR CONTINUE WITH</div>

    <button class="btn google" id="google">
      <svg viewBox="0 0 48 48">
        <path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5h6.7c3.9-3.6 6-8.8 6-14.9z"/>
        <path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.8l-6.7-5c-1.8 1.2-4 1.9-6.8 1.9-5.2 0-9.6-3.5-11.2-8.2H5.9v5.2A20 20 0 0 0 24 44z"/>
        <path fill="#FBBC05" d="M12.8 27.9a12 12 0 0 1 0-7.8v-5.2H5.9a20 20 0 0 0 0 18.2z"/>
        <path fill="#EA4335" d="M24 11.9c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 5.9 29.5 4 24 4A20 20 0 0 0 5.9 14.9l6.9 5.2c1.6-4.7 6-8.2 11.2-8.2z"/>
      </svg>
      Continue with Google
    </button>
    <div id="status"></div>
    <div class="hint">By continuing, you agree to use Nexora respectfully.</div>
  </div>
</div>

<div id="app">
  <aside class="sidebar">
    <div class="logo">
      <svg viewBox="0 0 100 100" fill="none">
        <path d="M18 78V22L82 78V22" stroke="#9665ff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M18 22L82 78" stroke="#53e6ff" stroke-width="5" stroke-linecap="round"/>
      </svg>
      <span>NEXORA<b>.</b></span>
    </div>

    <div class="section-label">YOUR CHANNELS</div>
    <button class="channel active" data-channel="general"># <span>general</span></button>
    <button class="channel" data-channel="gaming">🎮 <span>gaming</span></button>
    <button class="channel" data-channel="memes">😂 <span>memes</span></button>
    <button class="channel" data-channel="music">♫ <span>music</span></button>
    <button class="channel" data-channel="hangout">☕ <span>hangout</span></button>

    <div class="sidebar-bottom">
      <div class="profile">
        <div class="avatar" id="avatar">N</div>
        <div class="profile-info">
          <strong id="profileName">User</strong>
          <small>Online</small>
        </div>
      </div>
      <button class="channel logout" id="logout">↪ <span class="logout-text">Log out</span></button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h2 id="channelTitle"># general</h2>
      <span class="online">● Connected</span>
    </header>
    <section class="messages" id="messages">
      <div class="welcome">
        <strong>Welcome to Nexora</strong>
        Choose a channel and start chatting.
      </div>
    </section>
    <div class="composer">
      <form id="sendForm">
        <input id="messageInput" maxlength="1000" placeholder="Message #general..." autocomplete="off">
        <button class="btn" type="submit">Send ↑</button>
      </form>
    </div>
  </main>
</div>

<script>
const SUPABASE_URL = "https://qinygfihuqktnokzxmrt.supabase.co";
const SUPABASE_KEY = "sb_publishable_anLj1LjbDtSSeCGRJPc-zw_u2ghYdkC";

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let currentChannel = "general";
let subscription = null;
let switchingChannel = false;

const $ = id => document.getElementById(id);

function showStatus(message, success=false) {
  $("status").textContent = message;
  $("status").style.color = success ? "#80e9b2" : "#ffaaa8";
}

function setBusy(button,busy,label) {
  button.disabled = busy;
  button.textContent = busy ? "Please wait..." : label;
}

async function signUp() {
  const button = $("signup");
  const email = $("email").value.trim();
  const password = $("password").value;
  const name = $("name").value.trim();

  if (!email || !password || !name) {
    showStatus("Enter your display name, email and password.");
    return;
  }

  setBusy(button,true,"Create account");
  const {error} = await client.auth.signUp({
    email,password,
    options:{data:{display_name:name}}
  });
  setBusy(button,false,"Create account");
  showStatus(error ? error.message : "Account created. Check your email if confirmation is required.",!error);
}

async function signIn() {
  const button = $("login");
  const email = $("email").value.trim();
  const password = $("password").value;

  if (!email || !password) {
    showStatus("Enter your email and password.");
    return;
  }

  setBusy(button,true,"Log in");
  const {error} = await client.auth.signInWithPassword({email,password});
  setBusy(button,false,"Log in");
  if (error) showStatus(error.message);
}

async function googleLogin() {
  const button = $("google");

  if (!window.location.protocol.startsWith("http")) {
    showStatus("Open Nexora through a local web server, not by double-clicking the HTML file.");
    return;
  }

  button.disabled = true;
  button.textContent = "Connecting to Google...";
  showStatus("Opening Google sign-in...",true);

  try {
    const {data,error} = await client.auth.signInWithOAuth({
      provider:"google",
      options:{
        redirectTo:window.location.origin,
        skipBrowserRedirect:true
      }
    });

    if (error) throw error;
    if (!data?.url) throw new Error("Supabase did not return a Google sign-in URL.");

    window.location.assign(data.url);
  } catch (error) {
    showStatus("Google sign-in error: " + error.message);
    button.disabled = false;
    button.textContent = "Continue with Google";
  }
}

function showApp(user) {
  currentUser = user;
  $("auth").style.display = "none";
  $("app").style.display = "flex";

  const name = user.user_metadata?.display_name || user.email?.split("@")[0] || "User";
  $("profileName").textContent = name;
  $("avatar").textContent = name.charAt(0).toUpperCase();

  selectChannel("general");
}

async function logout() {
  const {error} = await client.auth.signOut();
  if (error) showStatus(error.message);
}

async function selectChannel(channel) {
  if (switchingChannel) return;
  switchingChannel = true;
  currentChannel = channel;

  $("channelTitle").textContent = "# " + channel;
  $("messageInput").placeholder = "Message #" + channel + "...";

  document.querySelectorAll(".channel[data-channel]").forEach(button => {
    button.classList.toggle("active",button.dataset.channel === channel);
  });

  if (subscription) {
    await client.removeChannel(subscription);
    subscription = null;
  }

  await loadMessages();

  subscription = client.channel("messages-" + channel)
    .on("postgres_changes",{
      event:"INSERT",
      schema:"public",
      table:"messages",
      filter:"channel=eq." + channel
    },payload => {
      if (payload.new.user_id !== currentUser?.id) addMessage(payload.new);
    })
    .subscribe();

  switchingChannel = false;
}

async function loadMessages() {
  const box = $("messages");
  box.innerHTML = "";

  const {data,error} = await client.from("messages")
    .select("*")
    .eq("channel",currentChannel)
    .order("created_at",{ascending:true})
    .limit(100);

  if (error) {
    box.textContent = "Couldn't load messages: " + error.message;
    return;
  }

  if (!data.length) {
    box.innerHTML = '<div class="welcome"><strong>Welcome to #' +
      currentChannel + '</strong>Be the first to start the conversation.</div>';
    return;
  }

  data.forEach(addMessage);
}

function addMessage(message) {
  const box = $("messages");
  const welcome = box.querySelector(".welcome");
  if (welcome) welcome.remove();

  const item = document.createElement("div");
  item.className = "message";

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = (message.username || "U").charAt(0).toUpperCase();

  const body = document.createElement("div");
  body.className = "message-body";

  const name = document.createElement("div");
  name.className = "message-name";
  name.textContent = message.username || "User";

  const content = document.createElement("div");
  content.className = "message-content";
  content.textContent = message.content;

  body.append(name,content);
  item.append(avatar,body);
  box.appendChild(item);
  box.scrollTop = box.scrollHeight;
}

async function sendMessage(event) {
  event.preventDefault();
  const input = $("messageInput");
  const content = input.value.trim();

  if (!content || !currentUser) return;

  const {data,error} = await client.from("messages").insert({
    user_id:currentUser.id,
    username:currentUser.user_metadata?.display_name || currentUser.email?.split("@")[0] || "User",
    channel:currentChannel,
    content
  }).select().single();

  if (error) {
    alert("Message error: " + error.message);
    return;
  }

  if (data) addMessage(data);
  input.value = "";
}

$("signup").addEventListener("click",signUp);
$("login").addEventListener("click",signIn);
$("google").addEventListener("click",googleLogin);
$("logout").addEventListener("click",logout);
$("sendForm").addEventListener("submit",sendMessage);

document.querySelectorAll(".channel[data-channel]").forEach(button => {
  button.addEventListener("click",() => selectChannel(button.dataset.channel));
});

client.auth.onAuthStateChange((event,session) => {
  if (session?.user) {
    if (currentUser?.id !== session.user.id) showApp(session.user);
  } else if (event === "SIGNED_OUT") {
    currentUser = null;
    $("app").style.display = "none";
    $("auth").style.display = "flex";
  }
});

client.auth.getSession().then(({data,error}) => {
  if (error) showStatus(error.message);
  if (data.session?.user) showApp(data.session.user);
});
</script>
</body>
</html>
