<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexora — Your space to talk</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#1e1f22;--rail:#17181b;--side:#2b2d31;--panel:#313338;--line:#3f4147;--text:#f2f3f5;--muted:#aeb2b9;--accent:#8b5cf6;--cyan:#40d9e8;--green:#23a55a;--red:#ed4245}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,Segoe UI,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:0;color:inherit}.hidden{display:none!important}
#auth{min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 15%,#49327d 0,#25202f 35%,#17181b 78%);padding:20px}
.authbox{width:min(420px,100%);background:#232428;border:1px solid #45404f;border-radius:18px;padding:30px;box-shadow:0 24px 80px #0008}.brand{display:flex;align-items:center;gap:12px;font-weight:900;font-size:25px;letter-spacing:.5px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--cyan));display:grid;place-items:center;font-weight:1000;color:white;font-size:23px}.muted{color:var(--muted)}.authbox h1{margin:26px 0 4px}.field{width:100%;padding:13px 14px;border-radius:8px;border:1px solid #484a52;background:#18191c;color:white;margin:7px 0 13px;outline:none}.field:focus{border-color:var(--accent)}.primary{background:var(--accent);padding:12px 16px;border-radius:8px;font-weight:750;width:100%}.primary:hover{filter:brightness(1.12)}.secondary{background:#454750;padding:10px 13px;border-radius:8px}.google{background:#f2f3f5;color:#202127;padding:11px;border-radius:8px;width:100%;font-weight:750;margin-top:9px}.authlinks{display:flex;gap:8px;margin-top:12px}.authlinks button{flex:1}.error{color:#ff8585;min-height:22px;font-size:13px}
#app{height:100vh;display:grid;grid-template-columns:72px 245px minmax(300px,1fr) 220px;overflow:hidden}
.rail{background:var(--rail);padding:12px 0;display:flex;align-items:center;flex-direction:column;gap:9px}.server{width:48px;height:48px;border-radius:16px;background:#303239;display:grid;place-items:center;font-weight:900;font-size:18px;transition:.15s}.server:hover,.server.active{border-radius:14px;background:var(--accent)}.server.add{color:var(--green);font-size:25px}.railsep{height:2px;width:30px;background:#41434a;margin:2px}
.sidebar{background:var(--side);display:flex;flex-direction:column;min-width:0}.sidehead{height:58px;border-bottom:1px solid #202126;display:flex;align-items:center;justify-content:space-between;padding:0 15px;font-weight:800}.scroll{overflow:auto;padding:13px 9px;flex:1}.section{font-size:11px;color:var(--muted);font-weight:850;letter-spacing:1px;padding:12px 9px 6px;display:flex;justify-content:space-between}.navitem{width:100%;text-align:left;background:transparent;color:#b9bbc2;padding:8px 10px;border-radius:6px;display:flex;gap:9px;align-items:center;margin:2px 0}.navitem:hover,.navitem.active{background:#404249;color:white}.navitem .count{margin-left:auto;background:var(--red);border-radius:10px;padding:0 6px;font-size:11px}.profile{background:#232428;padding:10px;display:flex;align-items:center;gap:9px}.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#9a68ff,#35c6d7);display:grid;place-items:center;font-weight:850;flex:none}.profileinfo{min-width:0;flex:1}.profileinfo strong,.profileinfo small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.profileinfo small{color:var(--muted);font-size:11px}.iconbtn{background:transparent;color:#b9bbc2;border-radius:6px;padding:7px}.iconbtn:hover{background:#41434a;color:white}
.main{display:flex;flex-direction:column;min-width:0;background:var(--panel)}.topbar{height:58px;border-bottom:1px solid #25262b;display:flex;align-items:center;padding:0 18px;gap:12px;box-shadow:0 1px 4px #0002}.topbar strong{font-size:15px}.topbar .right{margin-left:auto;display:flex;gap:6px}.chat{flex:1;overflow:auto;padding:22px max(20px,4vw);display:flex;flex-direction:column;gap:17px}.welcome{margin:auto auto 16px;max-width:680px;width:100%;padding:24px;border-radius:14px;background:#282a30;border:1px solid #41434a}.welcome h2{margin:0 0 6px}.msg{display:flex;gap:12px;max-width:850px}.msg .avatar{width:40px;height:40px}.msgbody{min-width:0}.msghead{display:flex;align-items:baseline;gap:9px}.msghead small{color:var(--muted)}.msgbody p{margin:4px 0;color:#dcdee2;white-space:pre-wrap;overflow-wrap:anywhere}.composerwrap{padding:0 22px 22px}.composer{display:flex;gap:10px;background:#383a40;border-radius:10px;padding:8px 12px;align-items:end}.composer textarea{background:transparent;border:0;outline:0;color:white;resize:none;max-height:130px;flex:1;padding:8px}.send{background:var(--accent);border-radius:8px;padding:9px 14px;font-weight:800}
.members{background:#2b2d31;border-left:1px solid #25262b;padding:16px 10px;overflow:auto}.members h4{font-size:11px;letter-spacing:1px;color:var(--muted);margin:12px 8px}.member{display:flex;align-items:center;gap:9px;padding:7px;border-radius:6px;color:#d5d7dc}.dot{width:9px;height:9px;border-radius:50%;background:var(--green);margin-left:auto}.modalbg{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:18px;z-index:5}.modal{width:min(460px,100%);background:#2b2d31;border:1px solid #555761;border-radius:14px;padding:22px;box-shadow:0 20px 70px #0009}.modalhead{display:flex;justify-content:space-between;align-items:center}.modal h2{margin:0}.modal p{color:var(--muted)}.modal .field{background:#1d1e22}.row{display:flex;gap:8px}.row>*{flex:1}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#17181b;border:1px solid #555;padding:10px 16px;border-radius:9px;z-index:10}
@media(max-width:900px){#app{grid-template-columns:64px 210px minmax(260px,1fr)}.members{display:none}}
@media(max-width:620px){#app{grid-template-columns:58px minmax(0,1fr)}.sidebar{display:none}.chat{padding:14px}.composerwrap{padding:0 12px 12px}}
</style>
</head>
<body>
<section id="auth">
 <div class="authbox">
  <div class="brand"><div class="logo">N</div> NEXORA</div>
  <h1 id="authTitle">Welcome back</h1><div class="muted" id="authSub">Sign in to continue to your communities.</div>
  <label>Email</label><input class="field" id="email" type="email" autocomplete="email" placeholder="you@example.com">
  <label>Password</label><input class="field" id="password" type="password" autocomplete="current-password" placeholder="Your password">
  <button class="primary" id="emailBtn">Log In</button>
  <button class="google" id="googleBtn">Continue with Google</button>
  <div class="authlinks"><button class="secondary" id="signupBtn">Create account</button><button class="secondary" id="resetBtn">Forgot password?</button></div>
  <div class="error" id="authError"></div>
 </div>
</section>
<section id="app" class="hidden">
 <aside class="rail">
  <button class="server active" title="Home" id="homeServer">N</button><div class="railsep"></div>
  <div id="serverRail"></div>
  <button class="server add" id="addServer" title="Create server">+</button>
  <button class="server add" id="joinServer" title="Join with invite">⌁</button>
 </aside>
 <aside class="sidebar">
  <div class="sidehead"><span id="sideTitle">Nexora</span><button class="iconbtn" id="serverMenu">⌄</button></div>
  <div class="scroll" id="sideContent"></div>
  <div class="profile"><div class="avatar" id="myAvatar">N</div><div class="profileinfo"><strong id="myName">User</strong><small>Online</small></div><button class="iconbtn" id="settingsBtn" title="Settings">⚙</button><button class="iconbtn" id="switchBtn" title="Switch account">⇄</button></div>
 </aside>
 <main class="main">
  <header class="topbar"><span id="channelIcon">#</span><strong id="channelTitle">general</strong><span class="muted" id="channelTopic">Welcome to Nexora</span><div class="right"><button class="iconbtn" id="friendsBtn" title="Friends">♟</button><button class="iconbtn" id="inviteBtn" title="Invite">↗</button><button class="iconbtn" id="callBtn" title="Call friend">☎</button></div></header>
  <div class="chat" id="chat"><div class="welcome"><h2>Welcome to Nexora 👋</h2><p class="muted">Your communities, friends and conversations in one place.</p></div></div>
  <div class="composerwrap"><div class="composer"><textarea id="messageInput" rows="1" placeholder="Message #general"></textarea><button class="send" id="sendBtn">Send</button></div></div>
 </main>
 <aside class="members"><h4>ONLINE — <span id="memberCount">1</span></h4><div class="member"><div class="avatar" id="memberAvatar">N</div><span id="memberName">You</span><i class="dot"></i></div><h4>YOUR FRIENDS</h4><div id="friendMembers" class="muted" style="padding:8px">Add friends to see them here.</div></aside>
</section>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
const SUPABASE_URL="https://qinygfihuqktnokzxmrt.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_anLj1LjbDtSSeCGRJPc-zw_u2ghYdkC";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let user=null, profile=null, currentServer=null, currentChannel="general", channelMode="server", messageChannel=null, refreshTimer=null;
let servers=[], friends=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(s){$("toast").textContent=s;$("toast").classList.remove("hidden");setTimeout(()=>$("toast").classList.add("hidden"),2800)}
function err(e){toast(e?.message||String(e))}
function showModal(title,body){$("modalRoot").innerHTML=`<div class="modalbg" id="modalbg"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="iconbtn" id="closeModal">✕</button></div>${body}</div></div>`;$("closeModal").onclick=closeModal;$("modalbg").onclick=e=>{if(e.target.id==="modalbg")closeModal()}}
function closeModal(){$("modalRoot").innerHTML=""}
function initials(s){return (s||"N").trim().slice(0,1).toUpperCase()}
async function authError(p){$("authError").textContent=p?.message||""}
async function loadProfile(){let {data,error}=await db.from("profiles").select("*").eq("id",user.id).maybeSingle();if(error)throw error;if(!data){const name=user.user_metadata?.full_name||user.email?.split("@")[0]||"Nexora user";let r=await db.from("profiles").upsert({id:user.id,username:name,display_name:name},{onConflict:"id"}).select().single();if(r.error)throw r.error;data=r.data}profile=data;const name=profile.display_name||profile.username||user.email; $("myName").textContent=name;$("myAvatar").textContent=initials(name);$("memberName").textContent=name;$("memberAvatar").textContent=initials(name)}
async function enter(){let {data}=await db.auth.getUser();user=data.user;if(!user)return;$("auth").classList.add("hidden");$("app").classList.remove("hidden");try{await loadProfile();await loadServers();await loadFriends();await loadMessages()}catch(e){err(e)}}
db.auth.onAuthStateChange((_event,session)=>{if(session?.user){user=session.user;setTimeout(enter,0)}else{user=null;$("app").classList.add("hidden");$("auth").classList.remove("hidden")}});
$("emailBtn").onclick=async()=>{authError();let {error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error)authError(error);else enter()};
$("signupBtn").onclick=async()=>{authError();let {error}=await db.auth.signUp({email:$("email").value.trim(),password:$("password").value,options:{data:{display_name:$("email").value.split("@")[0]}}});authError(error||{message:"Check your email if confirmation is enabled."})};
$("googleBtn").onclick=async()=>{authError();let {error}=await db.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname}});if(error)authError(error)};
$("resetBtn").onclick=async()=>{let email=$("email").value.trim();if(!email)return authError({message:"Enter your email first."});let {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});authError(error||{message:"Password reset email sent."})};
$("switchBtn").onclick=async()=>{await db.auth.signOut({scope:"local"});location.reload()};
$("settingsBtn").onclick=()=>showModal("Account settings",`<p>Signed in as <b>${esc(user.email)}</b></p><label>Display name</label><input class="field" id="displayName" value="${esc(profile?.display_name||profile?.username||"")}"><button class="primary" id="saveProfile">Save profile</button><p><button class="secondary" id="signOutAll">Sign out all sessions</button></p>`);
document.addEventListener("click",async e=>{if(e.target.id==="saveProfile"){let n=$("displayName").value.trim();if(!n)return;let {error}=await db.from("profiles").update({display_name:n}).eq("id",user.id);if(error)return err(error);profile.display_name=n;$("myName").textContent=n;$("myAvatar").textContent=initials(n);closeModal();toast("Profile updated")}if(e.target.id==="signOutAll"){await db.auth.signOut({scope:"global"});location.reload()}});
async function loadServers(){let {data,error}=await db.from("server_members").select("server_id,servers(id,name,owner_id)").eq("user_id",user.id);if(error)throw error;servers=(data||[]).map(x=>x.servers).filter(Boolean);if(!servers.length){let {data:s,error:se}=await db.from("servers").insert({name:"My server",owner_id:user.id}).select().single();if(se)throw se;let {error:me}=await db.from("server_members").insert({server_id:s.id,user_id:user.id,role:"owner"});if(me)throw me;servers=[s]}renderServers();selectServer(servers[0])}
function renderServers(){$("serverRail").innerHTML=servers.map(s=>`<button class="server ${currentServer?.id===s.id?"active":""}" data-server="${s.id}" title="${esc(s.name)}">${esc(initials(s.name))}</button>`).join("");document.querySelectorAll("[data-server]").forEach(b=>b.onclick=()=>selectServer(servers.find(s=>s.id===b.dataset.server)))}
async function selectServer(s){currentServer=s;channelMode="server";currentChannel="general";$("sideTitle").textContent=s.name;renderServers();let {data,error}=await db.from("channels").select("*").eq("server_id",s.id).order("created_at");if(error)return err(error);if(!data.length){let {data:c,error:ce}=await db.from("channels").insert({server_id:s.id,name:"general",created_by:user.id}).select().single();if(ce)return err(ce);data=[c]}renderChannels(data);await loadMessages()}
function renderChannels(ch){$("sideContent").innerHTML=`<div class="section">TEXT CHANNELS <button class="iconbtn" id="addChannel">＋</button></div>`+ch.map(c=>`<button class="navitem ${c.name===currentChannel?"active":""}" data-channel="${esc(c.name)}"># ${esc(c.name)}</button>`).join("")+`<div class="section">SERVER TOOLS</div><button class="navitem" id="makeInvite">↗ Create invite</button><button class="navitem" id="serverMembers">♟ Members</button>`;document.querySelectorAll("[data-channel]").forEach(b=>b.onclick=()=>{currentChannel=b.dataset.channel;loadMessages();renderChannels(ch)})}
$("sideContent").addEventListener("click",async e=>{if(e.target.id==="addChannel"){showModal("Create channel",`<input class="field" id="newChannel" placeholder="channel-name"><button class="primary" id="createChannel">Create channel</button>`);$("createChannel").onclick=async()=>{let name=$("newChannel").value.trim().toLowerCase().replace(/[^a-z0-9-]/g,"-");if(!name)return;let {error}=await db.from("channels").insert({server_id:currentServer.id,name,created_by:user.id});if(error)return err(error);closeModal();selectServer(currentServer)}}if(e.target.id==="makeInvite")createInvite();if(e.target.id==="serverMembers")showServerMembers()});
async function loadMessages(){if(!user)return;if(messageChannel){db.removeChannel(messageChannel);messageChannel=null}let q=db.from("messages").select("id,user_id,content,created_at,profiles(display_name,username)").eq("channel",currentChannel).order("created_at").limit(100);if(channelMode==="server")q=q.eq("server_id",currentServer.id);else q=q.eq("dm_id",currentChannel);let {data,error}=await q;if(error){$("chat").innerHTML=`<div class="welcome"><h2>Messages unavailable</h2><p>${esc(error.message)}</p><p class="muted">Check the SQL setup file and Supabase policies.</p></div>`;return}renderMessages(data||[]);$("channelTitle").textContent=currentChannel;messageChannel=db.channel("messages-live").on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},payload=>{if(payload.new.channel===currentChannel&&(channelMode==="dm"||payload.new.server_id===currentServer.id))loadMessages()}).subscribe()}
function renderMessages(rows){let chat=$("chat");chat.innerHTML=rows.length?"":`<div class="welcome"><h2>Welcome to #${esc(currentChannel)}</h2><p class="muted">This is the beginning of this channel.</p></div>`;rows.forEach(m=>{let name=m.profiles?.display_name||m.profiles?.username||(m.user_id===user.id?profile?.display_name:"Nexora member")||"Member";let el=document.createElement("div");el.className="msg";el.innerHTML=`<div class="avatar">${esc(initials(name))}</div><div class="msgbody"><div class="msghead"><b>${esc(name)}</b><small>${new Date(m.created_at).toLocaleString()}</small></div><p>${esc(m.content)}</p></div>`;chat.appendChild(el)});chat.scrollTop=chat.scrollHeight}
async function sendMessage(){let content=$("messageInput").value.trim();if(!content)return;let row={user_id:user.id,channel:currentChannel,content};if(channelMode==="server")row.server_id=currentServer.id;else row.dm_id=currentChannel;let {error}=await db.from("messages").insert(row);if(error)return err(error);$("messageInput").value="";await loadMessages()}
$("sendBtn").onclick=sendMessage;$("messageInput").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}};
$("addServer").onclick=()=>showModal("Create a server",`<p>Start a new community.</p><input class="field" id="serverName" placeholder="Server name"><button class="primary" id="createServer">Create server</button>`);document.addEventListener("click",async e=>{if(e.target.id==="createServer"){let name=$("serverName").value.trim();if(!name)return;let {data,error}=await db.from("servers").insert({name,owner_id:user.id}).select().single();if(error)return err(error);let {error:me}=await db.from("server_members").insert({server_id:data.id,user_id:user.id,role:"owner"});if(me)return err(me);closeModal();await loadServers();selectServer(data)}});
$("joinServer").onclick=()=>showModal("Join a server",`<p>Paste an invite code.</p><input class="field" id="inviteCode" placeholder="Invite code"><button class="primary" id="acceptInvite">Join server</button>`);document.addEventListener("click",async e=>{if(e.target.id==="acceptInvite"){let code=$("inviteCode").value.trim();let {data,error}=await db.rpc("accept_server_invite",{invite_code:code});if(error)return err(error);closeModal();await loadServers();toast("Joined server")}});
async function createInvite(){let {data,error}=await db.rpc("create_server_invite",{target_server:currentServer.id});if(error)return err(error);showModal("Server invite",`<p>Share this invite code with a friend.</p><input class="field" id="inviteOut" readonly value="${esc(data)}"><button class="primary" id="copyInvite">Copy invite code</button>`);$("copyInvite").onclick=()=>navigator.clipboard.writeText(data).then(()=>toast("Copied invite"))}
$("inviteBtn").onclick=createInvite;
async function loadFriends(){let {data,error}=await db.from("friendships").select("id,status,requester_id,addressee_id,requester:profiles!friendships_requester_id_fkey(id,username,display_name),addressee:profiles!friendships_addressee_id_fkey(id,username,display_name)").or(`requester_id.eq.${user.id},addressee_id.eq.${user.id}`);if(error){console.warn(error);return}friends=data||[];renderFriends()}
function renderFriends(){$("friendMembers").innerHTML=friends.filter(f=>f.status==="accepted").map(f=>{let p=f.requester_id===user.id?f.addressee:f.requester;return `<div class="member"><div class="avatar">${esc(initials(p?.display_name||p?.username))}</div>${esc(p?.display_name||p?.username||"Friend")}</div>`}).join("")||"No friends yet."}
$("friendsBtn").onclick=showFriends;
function showFriends(){showModal("Friends",`<p>Add friends using their exact username.</p><div class="row"><input class="field" id="friendName" placeholder="username"><button class="secondary" id="sendFriend">Add</button></div><div id="friendList"></div>`);let list=$("friendList");list.innerHTML=friends.map(f=>{let p=f.requester_id===user.id?f.addressee:f.requester;return `<p>${esc(p?.display_name||p?.username||"User")} — ${esc(f.status)} ${f.status==="pending"&&f.addressee_id===user.id?`<button class="secondary" data-accept="${f.id}">Accept</button>`:""}</p>`}).join("")||"<p>No requests or friends yet.</p>";$("sendFriend").onclick=async()=>{let n=$("friendName").value.trim();let {data,error}=await db.from("profiles").select("id").ilike("username",n).neq("id",user.id).maybeSingle();if(error||!data)return toast("User not found");let {error:fe}=await db.from("friendships").insert({requester_id:user.id,addressee_id:data.id,status:"pending"});if(fe)return err(fe);toast("Friend request sent");closeModal();loadFriends()}}
document.addEventListener("click",async e=>{if(e.target.dataset.accept){let {error}=await db.from("friendships").update({status:"accepted"}).eq("id",e.target.dataset.accept).eq("addressee_id",user.id);if(error)return err(error);closeModal();loadFriends()}});
$("callBtn").onclick=()=>showModal("Call a friend",`<p>Voice and video calling needs a WebRTC signalling service and a secure call session. This interface is ready for that integration, but calls are not connected yet.</p><button class="primary" id="callClose">Got it</button>`);document.addEventListener("click",e=>{if(e.target.id==="callClose")closeModal()});
async function showServerMembers(){let {data,error}=await db.from("server_members").select("profiles(username,display_name)").eq("server_id",currentServer.id);if(error)return err(error);showModal("Server members",`<div>${(data||[]).map(x=>`<p>${esc(x.profiles?.display_name||x.profiles?.username||"Member")}</p>`).join("")}</div>`)}
enter();
</script>
</body></html>
